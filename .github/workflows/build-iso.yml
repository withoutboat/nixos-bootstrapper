name: Build Public Installer ISO

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Nix Package Manager Environment
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Go Toolchain Engine
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile Go Installer Binary Architecture
        run: |
          cd go-installer
          GOOS=linux GOARCH=amd64 go build -o ../go-installer-bin main.go
          cd ..

      - name: Construct Standalone ISO Local Image Tree
        run: |
          mkdir -p ./iso-registry/nixos-config
          cp -r ./hosts ./flake.nix ./iso-registry/nixos-config/
          # Copy target executable engine runtime profile assets
          cp ./go-installer-bin ./iso-registry/installer

      - name: Execute Native NixOS ISO Composition
        run: |
          nix build .#nixosConfigurations.iso.config.system.build.isoImage

      - name: Publish Compiled Installation Media to Assets Release Pipeline
        uses: softprops/action-gh-release@v1
        with:
          files: result/iso/*.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
