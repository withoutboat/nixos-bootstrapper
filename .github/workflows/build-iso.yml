name: Build Installer & Release Secure ISO

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # 1. Compile the TUI installer binary for target 64-bit Linux architecture
      - name: Build Go Installer
        run: |
          cd go-installer
          go mod tidy
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o go-installer-linux-amd64 main.go

      # 2. Set up the Nix package manager environments inside the runner
      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # 3. Build the production air-gapped NixOS Live-CD ISO
      # This image bakes in the encrypted SOPS configs but contains ZERO keys or passphrases
      - name: Build Custom NixOS ISO
        run: |
          nix build .#nixosConfigurations.iso.config.system.build.isoImage --impure
          cp result/iso/*.iso ./nixos-secure-installer.iso

      # 4. Publish only pure code artifacts and the bootable image to GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            go-installer/go-installer-linux-amd64
            nixos-secure-installer.iso
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
